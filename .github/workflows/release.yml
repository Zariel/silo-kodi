name: Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python scripts/dev.py check
      - name: Verify version and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/dev.py package --release-tag "$RELEASE_TAG"
      - name: Attach ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/plugin.video.silo-${RELEASE_TAG#v}.zip" \
            "dist/plugin.video.silo-${RELEASE_TAG#v}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY"
